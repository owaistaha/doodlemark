# Build + unit tests (including the SVG export gate) on every push.
# UI tests only when started by hand (Actions → CI → Run workflow → UI tests):
# they take ~10 minutes and drive the canvas through XCTest's private touch
# synthesis, which a new Xcode can change under us.
#
# Runner: macos-26 (Apple silicon). Checked against actions/runner-images
# images/macos/macos-26-arm64-Readme.md in November 2026: default Xcode 26.6
# (17F113, the version this project is developed with), iOS 26.5 simulator
# runtime with iPad (A16). XcodeGen isn't on the image, so it's installed.
# No signing: simulator builds only, no Team ID (Local.xcconfig is optional).
name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Also run the UI tests (slow, uses private touch synthesis)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  unit-tests:
    name: Build + unit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPad simulator
        run: echo "SIM_ID=$(scripts/pick_ipad_simulator.sh)" >> "$GITHUB_ENV"

      - name: Build (Debug, for testing)
        run: |
          xcodebuild build-for-testing \
            -project Doodlemark.xcodeproj -scheme Doodlemark \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Unit tests (with the SVG export gate)
        run: |
          xcodebuild test-without-building \
            -project Doodlemark.xcodeproj -scheme Doodlemark \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DoodlemarkTests \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (Release, must have no debug screens)
        run: |
          xcodebuild build \
            -project Doodlemark.xcodeproj -scheme Doodlemark -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -n 20
          app=$(find DerivedData/Build/Products/Release-iphonesimulator -maxdepth 1 -name 'Doodlemark.app')
          if strings "$app/Doodlemark" | grep -E 'ExportDebugScreen|CanvasSpikeScreen|debugLessonTarget'; then
            echo "::error::Debug-only code is in the Release build"
            exit 1
          fi

      - name: Keep the test results and gate images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            UnitTests.xcresult
            DoodlemarkTests/GateOutput
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    if: github.event_name == 'workflow_dispatch' && inputs.ui_tests
    needs: unit-tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick and boot an iPad simulator
        run: |
          id=$(scripts/pick_ipad_simulator.sh)
          echo "SIM_ID=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b

      - name: UI tests
        run: |
          xcodebuild test \
            -project Doodlemark.xcodeproj -scheme Doodlemark \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DoodlemarkUITests \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the test results (screenshots inside)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITests.xcresult
          if-no-files-found: ignore
