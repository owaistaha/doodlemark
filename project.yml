name: Doodlemark
options:
  bundleIdPrefix: com.owaistaha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Signing team comes from the gitignored Local.xcconfig via Config/Base.xcconfig.
# Don't add DEVELOPMENT_TEAM below: settings here override the xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"        # iPad only
    CODE_SIGN_STYLE: Automatic
targets:
  Doodlemark:
    type: application
    platform: iOS
    sources:
      - path: Doodlemark
    info:
      path: Doodlemark/Info.plist
      properties:
        CFBundleDisplayName: Doodlemark
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:                    # bundled OFL fonts (license: <Name>-OFL.txt next to each)
          - LilitaOne-Regular.ttf      # PostScript name: LilitaOne (logo font, bubbly; export gate)
          - Bungee-Regular.ttf         # logo font, blocky (Bungee-Regular)
          - Sniglet-ExtraBold.ttf      # logo font, rounded (Sniglet-ExtraBold)
          - Pacifico-Regular.ttf       # logo font, script (Pacifico-Regular)
          - Poppins-ExtraBold.ttf      # logo font, clean geometric (Poppins-ExtraBold)
          - Inter-Regular.ttf          # UI, static 400 (Inter-Regular)
          - Inter-SemiBold.ttf         # UI, static 600 (Inter-SemiBold)
          - Inter-Bold.ttf             # UI, static 700 (Inter-Bold)
          - BricolageGrotesque-ExtraBold.ttf  # UI display, static 800 (BricolageGrotesque-ExtraBold)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.doodlemark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DoodlemarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoodlemarkTests
        excludes:
          - "GateOutput/**"            # gate images for humans, not test resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.doodlemark.tests
    dependencies:
      - target: Doodlemark
  DoodlemarkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DoodlemarkUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.doodlemark.uitests
        TEST_TARGET_NAME: Doodlemark
    dependencies:
      - target: Doodlemark
schemes:
  Doodlemark:
    build:
      targets:
        Doodlemark: all
        DoodlemarkTests: [test]
        DoodlemarkUITests: [test]
    test:
      targets:
        - DoodlemarkTests
        - DoodlemarkUITests
